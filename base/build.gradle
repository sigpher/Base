//        main {
//            if (rootProject.ext.buildMode["isApk"]) {
//                manifest.srcFile 'src/main/debug/AndroidManifest.xml'
//                res.srcDirs = [
//                        'src/main/res/release',
//                        'src/main/res/debug',
//                        'src/main/res'
//                ]
//            } else {
//                manifest.srcFile 'src/main/AndroidManifest.xml'
//                res.srcDirs = [
//                        'src/main/res/release',
//                        'src/main/res'
//                ]
//                java {
//                    exclude '/debug/base/**'
//                }
//            }
//        }
//    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    implementation 'androidx.core:core-ktx:1.0.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.3.31"

    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.vectordrawable:vectordrawable:1.0.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    api 'com.jaeger.statusbaruitl:library:1.3.2'
    api 'io.reactivex.rxjava2:rxjava:2.2.8'
    api 'io.reactivex.rxjava2:rxandroid:2.1.1'
    api 'com.squareup.retrofit2:retrofit:2.5.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.5.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:2.5.0'
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:1.6.3'
    releaseImplementation 'com.squareup.leakcanary:leakcanary-android-no-op:1.6.3'
    implementation 'com.tencent.sonic:sdk:3.1.0'
    api 'com.uber.autodispose:autodispose-android-archcomponents:1.3.0'
//    implementation 'com.arialyy.aria:aria-core:3.6.3'
//    annotationProcessor 'com.arialyy.aria:aria-compiler:3.6.3'
    implementation 'com.liulishuo.okdownload:okdownload:1.0.5'

    api 'com.blankj:utilcodex:1.23.7'
}

//项目主页
def siteUrl = 'https://github.com/sigpher/Base'
//项目的git地址
def gitUrl = 'https://github.com/sigpher/Base.git'

// JitPack 多模块坐标：group = com.github.<user>.<repo>，artifactId = 模块名（base）
// 依赖写法：implementation 'com.github.sigpher.Base:base:<tag>'
group = "com.github.sigpher.Base"
// JitPack 构建时会注入 VERSION 环境变量（值即 tag），本地构建回退到默认版本
version = System.getenv("VERSION") ?: "1.1.5-beta9"

//生成源文件
task sourcesJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    classifier = 'sources'
}

// JitPack 通过 ./gradlew install 产出 aar + pom + sources
// 不再打包 javadoc（源码目录含 Kotlin，javadoc 任务容易失败导致发布中断）
artifacts {
    archives sourcesJar
}

// 配置maven库，生成POM.xml文件
install {
    repositories.mavenInstaller {
        // This generates POM.xml with proper parameters
        pom {
            project {
                packaging 'aar'
                //项目描述，随意填
                name 'Base'
                url siteUrl
                licenses {
                    license {
                        //开源协议
                        name 'The Apache Software License, Version 2.0'
                        url 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        //原作者信息
                        id 'aaron9603'
                        name 'AaronZheng'
                        email 'aaronzheng9603@gmail.com'
                    }
                    developer {
                        //fork 维护者
                        id 'sigpher'
                        name 'sigpher'
                    }
                }
                scm {
                    connection gitUrl
                    developerConnection gitUrl
                    url siteUrl
                }
            }
        }
    }
}
