plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def libVersion = System.getenv("VERSION") ?: "1.2.0"

android {
    namespace 'com.sigpher.base'
    compileSdk 34

    resourcePrefix "base_"

    defaultConfig {
        minSdk 21
        targetSdk 34

        vectorDrawables.useSupportLibrary = true
        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    // 只保留 xPDF 实际使用的能力：Activity/Fragment 基类、Glide 图片加载、StatusBarUtils、通用工具
    api 'androidx.appcompat:appcompat:1.6.1'
    api 'com.blankj:utilcodex:1.23.7'

    // 与 xPDF 现有版本保持一致，避免额外引入新依赖
    implementation 'com.github.bumptech.glide:glide:4.9.0'
}

// 项目主页
def siteUrl = 'https://github.com/sigpher/Base'
def gitUrl = 'https://github.com/sigpher/Base.git'

group = 'com.github.sigpher.Base'
version = libVersion

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifactId = 'base'

                pom {
                    name = 'Base'
                    description = 'Lightweight Android base library for xPDF (base / image / impl / util only)'
                    url = siteUrl
                    packaging = 'aar'
                    licenses {
                        license {
                            name = 'The Apache Software License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'aaron9603'
                            name = 'AaronZheng'
                            email = 'aaronzheng9603@gmail.com'
                        }
                        developer {
                            id = 'sigpher'
                            name = 'sigpher'
                        }
                    }
                    scm {
                        connection = gitUrl
                        developerConnection = gitUrl
                        url = siteUrl
                    }
                }
            }
        }
    }
}
